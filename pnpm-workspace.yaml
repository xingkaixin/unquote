packages:
  - apps/*
  - packages/*

overrides:
  esbuild: 0.28.2
  # React 19.3 exceeds the current UI JavaScript bundle budgets.
  react: ~19.2.8
  react-dom: ~19.2.8

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@5.0.0'
  - '@vitest/mocker@5.0.0'
  - '@vitest/spy@5.0.0'
  - vitest@5.0.0
