packages:
  - apps/*
  - packages/*

catalog:
  '@tailwindcss/vite': ^4.3.5
  react: ^19.3.1
  react-dom: ^19.3.1
  sonner: ^2.0.8
  tailwindcss: ^4.3.5
  vite: ^8.3.8

overrides:
  react: 'catalog:'
  react-dom: 'catalog:'

allowBuilds:
  esbuild: true

audit:
  ignore:
    # Temporary while the development-only picomatch versions lack fixes.
    - GHSA-fc5q-39xc-vjpf

minimumReleaseAgeExclude:
  - '@types/node@24.19.4'
