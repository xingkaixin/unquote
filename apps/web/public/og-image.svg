<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Unquote</title>
  <desc id="desc">A social preview image for Unquote with the product logo.</desc>

  <defs>
    <linearGradient id="bg" x1="60" y1="40" x2="1140" y2="590" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.45" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 314) rotate(90) scale(300 360)">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#f5d0fe"/>
    </radialGradient>
    <linearGradient id="accent" x1="98" y1="390" x2="430" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1e293b" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="892" cy="314" r="282" fill="url(#halo)" opacity="0.82"/>
  <circle cx="1010" cy="118" r="72" fill="#bfdbfe" opacity="0.58"/>
  <circle cx="742" cy="528" r="98" fill="#fed7aa" opacity="0.42"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="88" y="264" fill="#0f172a" font-size="108" font-weight="820">Unquote</text>
    <text x="94" y="326" fill="#334155" font-size="34" font-weight="640">Escaped JSON, readable again.</text>
    <rect x="98" y="374" width="332" height="10" rx="5" fill="url(#accent)"/>
  </g>

  <image href="favicon.svg" x="572" y="44" width="536" height="536" preserveAspectRatio="xMidYMid meet" filter="url(#logo-shadow)"/>
</svg>
