name: Benchmark

on:
  pull_request:
    paths:
      - .github/workflows/benchmark.yml
      - apps/web/**
      - benchmark/**
      - packages/core/**
      - packages/ui/**
      - package.json
      - pnpm-lock.yaml
      - turbo.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Budget failures fail the job. The gate compares medians (see
      # perf-benchmark.mjs) so a single slow run on a shared runner does not
      # trip it; UNQUOTE_BENCH_*_BUDGET_* can relax a threshold without a code
      # change if a runner turns out to be pathological.
      - name: Run benchmark
        env:
          UNQUOTE_BENCH_OUTPUT: ${{ runner.temp }}/unquote-benchmark/latest.json
        run: dbus-run-session -- pnpm benchmark
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/unquote-benchmark/latest.json
          if-no-files-found: error
          retention-days: 14
