name: Benchmark

on:
  pull_request:
    paths:
      - .github/workflows/benchmark.yml
      - apps/web/**
      - benchmark/**
      - packages/core/**
      - packages/ui/**
      - package.json
      - pnpm-lock.yaml
      - turbo.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Budget failures fail the job. The gate compares medians (see
      # perf-benchmark.mjs) so a single slow run on a shared runner does not
      # trip it; UNQUOTE_BENCH_*_BUDGET_* can relax a threshold without a code
      # change if a runner turns out to be pathological.
      - name: Run benchmark
        env:
          UNQUOTE_BENCH_OUTPUT: ${{ runner.temp }}/unquote-benchmark/latest.json
          UNQUOTE_BENCH_AGENT_READY_BUDGET_MS: 700
          UNQUOTE_BENCH_AGENT_TRAJECTORY_READY_BUDGET_MS: 130
        run: dbus-run-session -- pnpm benchmark
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/unquote-benchmark/latest.json
          if-no-files-found: error
          retention-days: 14
