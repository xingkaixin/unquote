name: Benchmark

on:
  pull_request:
    paths:
      - .github/workflows/benchmark.yml
      - apps/web/**
      - benchmark/**
      - packages/core/**
      - packages/ui/**
      - package.json
      - pnpm-lock.yaml
      - turbo.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Budget failures fail the job. The gate compares medians (see
      # perf-benchmark.mjs) so a single slow run on a shared runner does not
      # trip it; UNQUOTE_BENCH_*_BUDGET_* can relax a threshold without a code
      # change if a runner turns out to be pathological.
      - name: Run benchmark
        env:
          UNQUOTE_BENCH_OUTPUT: ${{ runner.temp }}/unquote-benchmark/latest.json
          UNQUOTE_BENCH_AGENT_TRAJECTORY_READY_BUDGET_MS: 130
        run: dbus-run-session -- pnpm benchmark
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/unquote-benchmark/latest.json
          if-no-files-found: error
          retention-days: 14
