name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Keep CI aligned with the Node.js version declared in package.json.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit high-severity dependencies
        run: pnpm audit:high
      - run: pnpm check
      # The Safari artifact and its resource sync are pure Node work, so they
      # are verified here rather than paying for a macOS runner.
      - run: pnpm build:safari
      - name: Verify the Safari extension target was refilled
        run: git diff --exit-code -- "apps/safari/Unquote.xcodeproj/project.pbxproj"

  safari:
    # Only macOS can run xcodebuild, and this job answers one question the
    # Linux job cannot: does the synced extension still build inside its host
    # app? Signing, archiving, and uploading stay a release-time step.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:safari
      - name: Build the Safari host app without signing
        run: >-
          xcodebuild
          -project "apps/safari/Unquote.xcodeproj"
          -scheme Unquote
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build
      - name: Test the Safari host bridge without signing
        run: >-
          xcodebuild
          -project "apps/safari/Unquote.xcodeproj"
          -scheme Unquote
          -configuration Debug
          -destination "platform=macOS"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          test
