name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 22.12+ natively imports .ts files; oxfmt probes *.config.ts (e.g.
          # vite.config.ts) as a potential config and loads it via Node, which
          # fails on Node 20. Vite 8 also expects 20.19+/22.12+.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check
